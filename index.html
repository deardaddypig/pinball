// physics
function circ(b,px,py,pr,e){const dx=b.x-px,dy=b.y-py,m=R+pr;if(dx>m||dx<-m||dy>m||dy<-m)return;const d2=dx*dx+dy*dy;if(d2>=m*m)return;const d=Math.sqrt(d2)||.01,nx=dx/d,ny=dy/d;b.x=px+nx*m;b.y=py+ny*m;const vn=b.vx*nx+b.vy*ny;if(vn<0){b.vx-=(1+e)*vn*nx;b.vy-=(1+e)*vn*ny;b.vx+=(rr()-.5)*10;if(-vn>220)tick()}}
function arc(b,cx,cy,r,left){if(b.y>=cy||(left?b.x>cx:b.x<cx))return;const dx=b.x-cx,dy=b.y-cy,d=Math.hypot(dx,dy);if(d>r-R){const nx=-dx/d,ny=-dy/d;b.x=cx+dx/d*(r-R);b.y=cy+dy/d*(r-R);const vn=b.vx*nx+b.vy*ny;if(vn<0){b.vx-=1.3*vn*nx;b.vy-=1.3*vn*ny}}}
function vseg(b,sx,y0,y1,hw){if(b.y<y0||b.y>y1)return;const dx=b.x-sx,m=R+hw;if(Math.abs(dx)<m){const s=dx<0?-1:1;b.x=sx+s*m;if(b.vx*s<0)b.vx*=-.3}}

 const px=WX+ca*t,py=WY+sa*t,ex=b.x-px,ey=b.y-py,d=Math.hypot(ex,ey),m=R+3.5;if(d>=m)continue;
 const nx=ex/(d||.01),ny=ey/(d||.01);b.x=px+nx*m;b.y=py+ny*m;const rx=px-WX,ry=py-WY,vn=(b.vx+S.ww*ry)*nx+(b.vy-S.ww*rx)*ny;
 if(vn<0){const j=-1.35*vn;b.vx+=j*nx;b.vy+=j*ny;S.ww=Math.max(-14,Math.min(14,S.ww-j*(rx*ny-ry*nx)/1500));tick()}}}

function step(dt){S.wa+=S.ww*dt;S.ww*=1-.7*dt;for(let i=S.pl.length-1;i>=0;i--){const b=S.pl[i];b.vy+=G*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.age+=dt;
